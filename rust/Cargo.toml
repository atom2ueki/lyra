[package]
name = "lyra"
version = "0.5.0"
edition = "2024"
description = "Lyra — supervised task conductor for coding agents"
license = "MIT"
repository = "https://github.com/atom2ueki/lyra"

[[bin]]
name = "lyra"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
sha2 = "0.10"
thiserror = "2"
toml = "0.8"
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tempfile = "3"

[profile.release]
strip = true
lto = "thin"
codegen-units = 1
